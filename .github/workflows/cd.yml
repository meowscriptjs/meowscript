name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Set up npm
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci
      - name: Run linting
        run: npm run lint
      - name: Run formatting check
        run: npm run format:check
      - name: Run unit tests
        run: npm test
      - name: Publish to npm
        run: npm publish --provenance --access public

  publish-extension:
    name: Publish VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Set up npm
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Package extension
        run: npm run package
      - name: Read extension version
        id: extension
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish to Visual Studio Marketplace
        if: github.ref_name == format('v{0}', steps.extension.outputs.version)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ steps.extension.outputs.version }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT secret is not configured; the extension was not published to Visual Studio Marketplace."
            exit 0
          fi
          npx vsce publish -p "$VSCE_PAT" --packagePath "meowscript-language-$VERSION.vsix"
      - name: Publish to Open VSX
        if: github.ref_name == format('v{0}', steps.extension.outputs.version)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VERSION: ${{ steps.extension.outputs.version }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT secret is not configured; the extension was not published to Open VSX."
            exit 0
          fi
          npx ovsx publish "meowscript-language-$VERSION.vsix" -p "$OVSX_PAT"
